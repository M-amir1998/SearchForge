[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "searchforge"
version = "0.1.0.dev0"
description = "Production-oriented retrieval engineering platform: lexical, dense and hybrid search, multi-stage reranking, query planning, citation-ready context and reproducible search-quality evaluation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "M-amir1998" }]
keywords = ["information-retrieval", "hybrid-search", "bm25", "rag", "reranking", "evaluation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pyarrow>=15",
  "httpx>=0.27",
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
  "jsonschema>=4.21",
  "scipy>=1.11",
]

[project.optional-dependencies]
neural = ["sentence-transformers>=3.0"]
qdrant = ["qdrant-client>=1.12"]
opensearch = ["opensearch-py>=2.6"]
observability = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "detect-secrets>=1.5",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.21",
  "types-psutil>=5.9",
]

[project.scripts]
searchforge = "searchforge.cli.main:app"

[project.urls]
Repository = "https://github.com/M-amir1998/SearchForge-"
Documentation = "https://github.com/M-amir1998/SearchForge-/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/searchforge"]

[tool.hatch.build.targets.sdist]
include = [
  "src/searchforge",
  "tests",
  "configs",
  "docs",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "S", "N", "PL", "TID"]
ignore = [
  "PLR0913",  # explicit, typed constructors are preferred over parameter objects everywhere
  "PLR2004",  # numeric literals in IR math are self-describing
  "S101",     # asserts are used in tests
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "PLC0415",  # optional backends (qdrant, opensearch, sentence-transformers) are imported lazily on purpose
  "N818",     # exception names follow the documented error model (CorpusNotFound, IndexNotFound, ...)
  "PLR0917",
  "S105",     # false positives on enum values/regex constants named *TOKEN*
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "N806", "PT018"]
# Dynamic SQL in these modules only interpolates "?" placeholder lists and code-defined
# column/table names; every value is a bound parameter (see docs/architecture/indexing.md).
"src/searchforge/indexes/chunk_store.py" = ["S608"]
"src/searchforge/indexes/lexical/sqlite_fts.py" = ["S608"]
"src/searchforge/embeddings/cache.py" = ["S608"]
"src/searchforge/cli/main.py" = ["B008"]  # Typer declares options via defaults

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["searchforge"]

[[tool.mypy.overrides]]
module = [
  "sklearn.*",
  "scipy.*",
  "pyarrow.*",
  "sentence_transformers.*",
  "qdrant_client.*",
  "opensearchpy.*",
  "opentelemetry.*",
  "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: fast isolated tests",
  "property: Hypothesis property tests",
  "integration: multi-component tests on local backends",
  "quality: search-quality assertions on the fixture collection",
  "e2e: CPU end-to-end flows",
  "regression: retrieval regression and quality gate tests",
  "qdrant: requires qdrant-client (in-memory mode, no server)",
  "opensearch: requires a live OpenSearch at OPENSEARCH_URL",
  "neural: requires sentence-transformers and locally cached models",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["searchforge"]
branch = true

[tool.coverage.report]
show_missing = false
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
