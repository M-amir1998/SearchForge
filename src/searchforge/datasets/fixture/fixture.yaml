# SearchForge fixture collection: synthetic knowledge base of a fictional company ("Lumen").
# 48 documents (Markdown + JSONL + CSV), 56 judged queries across 5 query types.
# Paths prefixed with "pkg:" resolve inside the installed searchforge package.
workspace: .searchforge

corpus:
  id: lumen-fixture-v1
  sources:
    - id: kb
      path: pkg:fixture/corpus/kb
      glob: "*.md"
    - id: releases
      path: pkg:fixture/corpus/release_notes/releases.jsonl
    - id: errors
      path: pkg:fixture/corpus/error_codes/error_codes.csv
  filterable_fields:
    category: string
    team: string
    language: string
    published: date
    year: integer
    version: string
    severity: string

chunking:
  strategy: section
  max_chars: 1200
  overlap_chars: 150
  min_chars: 80

index:
  name: fixture
  data_profile: tiny
  lexical:
    backend: sqlite_fts
    title_weight: 2.0
  dense:
    provider: tfidf
    tfidf:
      svd_components: 128
      ngram_max: 2

search:
  default_profile: hybrid
  top_k: 10
  capture_policy: hash_only
  profiles:
    hybrid_rewrite:
      description: Hybrid RRF with deterministic acronym expansion and synonym multi-query
      retrievers: [lexical, dense]
      rewrite:
        enabled: true
        multi_query: true
        acronyms:
          k8s: kubernetes
          oom: out of memory
          sso: single sign-on
          pii: personal data
          tls: certificate
        synonyms:
          credentials: [api keys, secrets]
          outdated: [stale]
          undo: [roll back, rollback]

evaluation:
  queries: pkg:fixture/queries.jsonl
  qrels: pkg:fixture/qrels.jsonl
  k_values: [1, 3, 5, 10, 20]
  profiles: [lexical, dense, hybrid, weighted_hybrid, hybrid_rerank, adaptive]
  latency_repeats: 3
  gates:
    ndcg_at_10_min_delta: -0.005
    max_query_regression_rate: 0.10
    block_on_critical_regression: true

storage:
  reserve_free_gb: 2.0
